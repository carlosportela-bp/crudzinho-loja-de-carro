<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    {% if form.errors %}
        <p>Usuário ou senha inválidos.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <p><input type="text" name="username" placeholder="Usuário" required autofocus></p>
        <p><input type="password" name="password" placeholder="Senha" required></p>
        <button>Entrar</button>
    </form>
</body>
</html>
